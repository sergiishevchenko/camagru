version: '3.8'

services:
  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: camagru_web
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
      - ./backend/public/uploads:/var/www/html/public/uploads
      - ./frontend/css:/var/www/html/public/css
      - ./frontend/js:/var/www/html/public/js
      - ./frontend/images:/var/www/html/public/images
    depends_on:
      - db
    networks:
      - camagru_network
    environment:
      - DB_HOST=db
      - DB_NAME=camagru_db
      - DB_USER=camagru_user
      - DB_PASS=camagru_pass

  db:
    image: mysql:8.0
    container_name: camagru_db
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root_password
      - MYSQL_DATABASE=camagru_db
      - MYSQL_USER=camagru_user
      - MYSQL_PASSWORD=camagru_pass
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - camagru_network

  mailhog:
    image: mailhog/mailhog:latest
    container_name: camagru_mailhog
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks:
      - camagru_network

volumes:
  db_data:

networks:
  camagru_network:
    driver: bridge
